name: cnc_assist
description: "CNC Operator Assistant - AI-powered G-code analyzer and machining calculator"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^15.1.2

  # Backend
  supabase_flutter: ^2.9.0

  # HTTP
  dio: ^5.8.0+1

  # Local storage (offline-first)
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Connectivity
  connectivity_plus: ^6.1.4

  # File operations
  file_picker: ^8.3.7
  image_picker: ^1.1.2

  # PDF generation & print / share (Phase 3 — Setup Sheet Generator)
  pdf: ^3.10.8
  printing: ^5.12.0

  # In-app purchase / subscription (Phase 2)
  in_app_purchase: ^3.2.0

  # URL launcher
  url_launcher: ^6.3.1

  # Code syntax highlighting
  flutter_highlight: ^0.7.0

  # Utilities
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.20.2
  path_provider: ^2.1.5

  # Icons
  cupertino_icons: ^1.0.8
  material_design_icons_flutter: ^7.0.7296
  country_flags: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.7
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true

  assets:
    - assets/data/materials.json
    - assets/data/tools.json
    - assets/data/gcode_reference.json
    - assets/data/errors.json
    - assets/data/quiz.json
    - assets/data/tool_wear.json
    - assets/data/gcode_programs.json
    - assets/data/guides.json
    - assets/images/emad_owl.png

  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
